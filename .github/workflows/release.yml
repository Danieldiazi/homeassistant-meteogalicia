name: Publish Home Assistant release

on:
  push:
    branches: ["publish/v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate version, published API and HACS ZIP
        id: release
        run: python scripts/release.py --domain meteogalicia --output homeassistant-meteogalicia.zip --verify-dependencies
      - name: Publish release or attach validated ZIP
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: homeassistant-meteogalicia.zip
          fail_on_unmatched_files: true
