name: Refresh PR dependency locks (temporary)
on:
  push:
    branches:
      - dependabot/pip/test-dependencies-cc54dd6e15
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'ci: regenerate dependency locks for PR 61'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Resolve and hash all dependencies
        run: |
          python -m pip install uv==0.12.19
          uv pip compile requirements_test.txt --python-version 3.14.2 --python-platform x86_64-manylinux_2_39 --generate-hashes --only-binary :all: --no-binary mock-open,pyric -o requirements_test.lock
          uv pip compile requirements_build.txt -c requirements_test.lock --python-version 3.14.2 --python-platform x86_64-manylinux_2_39 --generate-hashes --only-binary :all: -o requirements_build.lock
      - name: Validate locked requirements and tests
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements_build.lock
          python -m pip install --require-hashes --only-binary :all: --no-binary mock-open,pyric --no-build-isolation -r requirements_test.lock
          python scripts/check_test_environment.py
          python -m pip check
          python -m compileall -q custom_components tests scripts
          ruff check --select E9,F63,F7,F82 custom_components tests scripts
          pytest -q --cov=custom_components/meteogalicia --cov=scripts --cov-report=term-missing --cov-fail-under=70
      - name: Commit updated locks and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-pr-locks.yml
          git add requirements_test.lock requirements_build.lock .github/workflows/refresh-pr-locks.yml
          git diff --cached --stat
          git commit -m "fix(ci): regenerate hashed dependency locks for HA 2026.10"
          git push
