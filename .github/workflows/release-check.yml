name: Validate HACS release package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test release validation failures
        run: python -m unittest discover -s tests_release -v
      - name: Validate version, published API and HACS archive
        env:
          GITHUB_REF_NAME: ""
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n "$BASE_REF" ]]; then args+=(--base-ref "$BASE_REF"); fi
          python scripts/release.py --domain meteogalicia --output homeassistant-meteogalicia.zip --verify-dependencies "${args[@]}"
