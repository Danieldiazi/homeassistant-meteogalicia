name: Validate HACS release package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test release validation failures
        run: python -m unittest discover -s tests_release -v
      - name: Check out the PR base for file comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .release-base
          persist-credentials: false
      - name: Validate version, published API and HACS archive
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then args+=(--base-directory .release-base); fi
          python scripts/release.py --domain meteogalicia --use-manifest-version --output homeassistant-meteogalicia.zip --verify-dependencies "${args[@]}"
