name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements_build.lock
            requirements_test.lock

      - name: Install locked build tools
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          -r requirements_build.txt -r requirements_build.lock

      - name: Install test dependencies
        # These two pinned test dependencies publish only sdists. Their hashes
        # and build tools are locked; all other packages must provide wheels.
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --no-binary mock-open,pyric --no-build-isolation
          -r requirements_test.txt -r requirements_test.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests

      - name: Validate JSON
        run: >-
          python -c "import json, pathlib;
          [json.loads(path.read_text()) for path in pathlib.Path('.').rglob('*.json')]"

      - name: Run critical Ruff checks
        run: ruff check --select E9,F63,F7,F82 custom_components tests

      - name: Run unit tests
        run: >-
          pytest -q
          --cov=custom_components/meteogalicia
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Check SonarQube configuration
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is unavailable. Tests passed, but coverage will not be sent to SonarQube Cloud. See docs/development.md."
          fi

      - name: Publish coverage to SonarQube Cloud
        if: steps.sonar.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
