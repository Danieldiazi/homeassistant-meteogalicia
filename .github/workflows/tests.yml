name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests

      - name: Validate JSON
        run: >-
          python -c "import json, pathlib;
          [json.loads(path.read_text()) for path in pathlib.Path('.').rglob('*.json')]"

      - name: Run critical Ruff checks
        run: ruff check --select E9,F63,F7,F82 custom_components tests

      - name: Run unit tests
        run: >-
          pytest -q
          --cov=custom_components/meteogalicia
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Publish coverage to SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
